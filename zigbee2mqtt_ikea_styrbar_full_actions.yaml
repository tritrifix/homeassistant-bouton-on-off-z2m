blueprint:
  name: "Zigbee2MQTT - IKEA STYRBAR : actions au choix pour chaque bouton"
  description: >
    Blueprint Home Assistant pour télécommande IKEA STYRBAR (E2001/E2002/E2313) via Zigbee2MQTT.
    Écoute un topic MQTT (JSON) et route les actions selon payload_json.action.

    Valeurs d'action attendues (données par toi) :
      - on
      - off
      - brightness_move_up
      - brightness_move_down
      - brightness_stop
      - arrow_left_click
      - arrow_left_hold
      - arrow_left_release
      - arrow_right_click
      - arrow_right_hold
      - arrow_right_release

    Pour chaque action, tu définis directement dans l'UI Home Assistant une séquence "Actions"
    (allumer une lampe, lancer une scène, appeler un script, etc.).

    Note : ce blueprint ne fait pas de logique interne de dimming ; il te laisse décider quoi faire
    sur brightness_move_up/down/stop (par ex appeler un script dimmer).

  domain: automation

  input:
    mqtt_topic:
      name: "Topic MQTT Zigbee2MQTT de la STYRBAR"
      description: "Ex: zigbee2mqtt/styrbar_salon (topic publiant un JSON contenant action)"
      selector:
        text: {}

    # Actions au choix
    on_actions:
      name: "Bouton ON"
      description: "Exécuté quand action == 'on'"
      default: []
      selector:
        action: {}

    off_actions:
      name: "Bouton OFF"
      description: "Exécuté quand action == 'off'"
      default: []
      selector:
        action: {}

    brightness_move_up_actions:
      name: "Luminosité + (move up / appui long)"
      description: "Exécuté quand action == 'brightness_move_up'"
      default: []
      selector:
        action: {}

    brightness_move_down_actions:
      name: "Luminosité - (move down / appui long)"
      description: "Exécuté quand action == 'brightness_move_down'"
      default: []
      selector:
        action: {}

    brightness_stop_actions:
      name: "Stop luminosité (relâche)"
      description: "Exécuté quand action == 'brightness_stop'"
      default: []
      selector:
        action: {}

    arrow_left_click_actions:
      name: "Flèche gauche - clic"
      description: "Exécuté quand action == 'arrow_left_click'"
      default: []
      selector:
        action: {}

    arrow_left_hold_actions:
      name: "Flèche gauche - appui long"
      description: "Exécuté quand action == 'arrow_left_hold'"
      default: []
      selector:
        action: {}

    arrow_left_release_actions:
      name: "Flèche gauche - relâche"
      description: "Exécuté quand action == 'arrow_left_release'"
      default: []
      selector:
        action: {}

    arrow_right_click_actions:
      name: "Flèche droite - clic"
      description: "Exécuté quand action == 'arrow_right_click'"
      default: []
      selector:
        action: {}

    arrow_right_hold_actions:
      name: "Flèche droite - appui long"
      description: "Exécuté quand action == 'arrow_right_hold'"
      default: []
      selector:
        action: {}

    arrow_right_release_actions:
      name: "Flèche droite - relâche"
      description: "Exécuté quand action == 'arrow_right_release'"
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

variables:
  act: "{{ trigger.payload_json.action | default('') }}"

action:
  - choose:
      - conditions: "{{ act == 'on' }}"
        sequence: !input on_actions

      - conditions: "{{ act == 'off' }}"
        sequence: !input off_actions

      - conditions: "{{ act == 'brightness_move_up' }}"
        sequence: !input brightness_move_up_actions

      - conditions: "{{ act == 'brightness_move_down' }}"
        sequence: !input brightness_move_down_actions

      - conditions: "{{ act == 'brightness_stop' }}"
        sequence: !input brightness_stop_actions

      - conditions: "{{ act == 'arrow_left_click' }}"
        sequence: !input arrow_left_click_actions

      - conditions: "{{ act == 'arrow_left_hold' }}"
        sequence: !input arrow_left_hold_actions

      - conditions: "{{ act == 'arrow_left_release' }}"
        sequence: !input arrow_left_release_actions

      - conditions: "{{ act == 'arrow_right_click' }}"
        sequence: !input arrow_right_click_actions

      - conditions: "{{ act == 'arrow_right_hold' }}"
        sequence: !input arrow_right_hold_actions

      - conditions: "{{ act == 'arrow_right_release' }}"
        sequence: !input arrow_right_release_actions
    default: []