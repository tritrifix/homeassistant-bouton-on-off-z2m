blueprint:
  name: "Zigbee2MQTT - Bouton universel (MQTT action → lampe)"
  description: >
    Blueprint universel pour boutons Zigbee via Zigbee2MQTT.
    Écoute un topic MQTT (JSON) et lit payload_json.action pour piloter une lampe:
    on/off/toggle + actions de dimming (brightness_move_up/down + stop) et actions type single/double/hold.
    Dimming sans blocage: boucle limitée dans le temps, stoppable par brightness_stop.
  domain: automation
  input:
    mqtt_topic:
      name: "Topic MQTT du bouton"
      description: "Exemple: zigbee2mqtt/button_chambre"
      default: "zigbee2mqtt/"
      selector:
        text: {}

    light_target:
      name: "Lampe à contrôler"
      selector:
        target:
          entity:
            domain: light

    # Actions (adaptables)
    action_on:
      name: "Valeur action = ON"
      default: "on"
      selector:
        text: {}
    action_off:
      name: "Valeur action = OFF"
      default: "off"
      selector:
        text: {}
    action_toggle:
      name: "Valeur action = TOGGLE"
      default: "toggle"
      selector:
        text: {}

    action_single:
      name: "Valeur action = SINGLE (optionnel)"
      default: "single"
      selector:
        text: {}
    action_double:
      name: "Valeur action = DOUBLE (optionnel)"
      default: "double"
      selector:
        text: {}
    action_hold:
      name: "Valeur action = HOLD (optionnel)"
      default: "hold"
      selector:
        text: {}

    # Dimming IKEA / autres
    action_dim_up:
      name: "Valeur action = dim up (appui long +)"
      default: "brightness_move_up"
      selector:
        text: {}
    action_dim_down:
      name: "Valeur action = dim down (appui long -)"
      default: "brightness_move_down"
      selector:
        text: {}
    action_dim_stop:
      name: "Valeur action = dim stop (relâche)"
      default: "brightness_stop"
      selector:
        text: {}

    # Paramètres de transition et luminosité
    transition_switch:
      name: "Temps de transition on/off (secondes)"
      description: "Transition time en secondes pour allumer/éteindre (0.0-10.0)"
      default: 1
      selector:
        number:
          min: 0.0
          max: 10.0
          mode: box
          step: 0.5
    
    step_up:
      name: "Pas luminosité UP (%)"
      description: "Step size pour augmenter la luminosité (0-20)"
      default: 5
      selector:
        number:
          min: 0.0
          max: 20.0
          mode: box
          step: 1.0
    
    step_down:
      name: "Pas luminosité DOWN (%)"
      description: "Step size pour diminuer la luminosité (-20 à 0)"
      default: -5
      selector:
        number:
          min: -20.0
          max: 0.0
          mode: box
          step: 1.0
    
    transition_dim:
      name: "Temps de transition dimming (secondes)"
      description: "Transition time en secondes pour dimming. 0 = pas de transition, >0.1 = plus fluide (0.0-10.0)"
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 10.0
          mode: box
          step: 0.5
    
    pause_dim:
      name: "Pause entre chaque étape de dimming (ms)"
      description: "Délai entre chaque étape de dimming en millisecondes (10-2000)"
      default: 500
      selector:
        number:
          min: 10.0
          max: 2000.0
          mode: box
          step: 10.0
    
    dim_repeat_count:
      name: "Nombre de répétitions dimming"
      description: "Nombre maximum d'étapes pour le dimming (1-30)"
      default: 20
      selector:
        number:
          min: 1
          max: 30
          mode: slider

mode: restart

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

variables:
  act: "{{ trigger.payload_json.action | default('') }}"
  light_target: !input light_target

  action_on: !input action_on
  action_off: !input action_off
  action_toggle: !input action_toggle

  action_single: !input action_single
  action_double: !input action_double
  action_hold: !input action_hold

  action_dim_up: !input action_dim_up
  action_dim_down: !input action_dim_down
  action_dim_stop: !input action_dim_stop

  transition_switch: !input transition_switch
  step_up: !input step_up
  step_down: !input step_down
  transition_dim: !input transition_dim
  pause_dim: !input pause_dim
  dim_repeat_count: !input dim_repeat_count

action:
  - choose:
      # ON / OFF / TOGGLE
      - conditions: "{{ act == action_on }}"
        sequence:
          - service: light.turn_on
            target: "{{ light_target }}"
            data:
              transition: "{{ transition_switch }}"

      - conditions: "{{ act == action_off }}"
        sequence:
          - service: light.turn_off
            target: "{{ light_target }}"
            data:
              transition: "{{ transition_switch }}"

      - conditions: "{{ act == action_toggle }}"
        sequence:
          - service: light.toggle
            target: "{{ light_target }}"
            data:
              transition: "{{ transition_switch }}"

      # SINGLE / DOUBLE / HOLD (par défaut: toggle / toggle / toggle, modifiable si tu veux)
      - conditions: "{{ act == action_single }}"
        sequence:
          - service: light.toggle
            target: "{{ light_target }}"

      - conditions: "{{ act == action_double }}"
        sequence:
          - service: light.toggle
            target: "{{ light_target }}"

      - conditions: "{{ act == action_hold }}"
        sequence:
          - service: light.toggle
            target: "{{ light_target }}"

      # DIM UP
      - conditions: "{{ act == action_dim_up }}"
        sequence:
          - repeat:
              count: "{{ dim_repeat_count }}"
              sequence:
                - service: light.turn_on
                  target: "{{ light_target }}"
                  data:
                    transition: "{{ transition_dim }}"
                    brightness_step_pct: "{{ step_up }}"
                - delay:
                    milliseconds: "{{ pause_dim }}"

      # DIM DOWN
      - conditions: "{{ act == action_dim_down }}"
        sequence:
          - repeat:
              count: "{{ dim_repeat_count }}"
              sequence:
                - service: light.turn_on
                  target: "{{ light_target }}"
                  data:
                    transition: "{{ transition_dim }}"
                    brightness_step_pct: "{{ step_down }}"
                - delay:
                    milliseconds: "{{ pause_dim }}"

      # DIM STOP (avec ce blueprint "simple", le stop sert surtout à couper une exécution en cours)
      - conditions: "{{ act == action_dim_stop }}"
        sequence:
          - stop: "Stop dimming request received"